name: daily-build

# 内田さんのPCが落ちていても GitHub 側で走る。
# 🚨 GitHub の schedule は数時間遅れる（実測: 06:10 JST 指定で 08:13〜14:18 JST に発火・2026-08-28〜09-02）。
#    朝に見る人へ「今日」を出すため、本命 03:17 JST に加えて予備を 05:43 / 07:29 JST に置く。
#    直前のビルドから6時間以内なら build.py が何もせず終わる（API消費ゼロ・commitも無し）ので、
#    3本とも発火しても朝の更新は1回だけ。分は :00 を避けている（毎時0分は混雑で遅れやすい）。
# workflow_dispatch を付けてあるので、手動実行ボタンからいつでも即時更新できる（FORCE=1 で間隔ガードを無視）。
on:
  schedule:
    - cron: '17 18 * * *'
    - cron: '43 20 * * *'
    - cron: '29 22 * * *'
  workflow_dispatch:

# index.html / data.json を書き戻すため書き込み権限が要る
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build.py は Python 標準ライブラリだけで動くので pip install は不要
      - name: Build site (JP)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python build.py

      # 🇺🇸 英語版「Japan Buzz」（2026-09-03 追加）。同じジョブの中でJP版の直後に続けて走らせる
      # （ワークフローもキーもJP版と共有。同一GCPプロジェクトの同じ日次枠を消費するだけで新規契約は無い）。
      # if: always() で JP版が exit(1) した日でも EN版は独立して試す（帰ってきた全員返す・一日でも
      # 滞ったら止めない、の考え方をエディション間にも適用）。片方でも失敗すればジョブは赤いままなので
      # 気づけなくなることはない（`|| true` は付けない）。
      - name: Build site (EN - Japan Buzz)
        if: always()
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python build.py --edition en

      # 差分が無い日は commit しない（空コミットでヒストリを汚さない）。JP/EN 両方のファイルをまとめて1コミット。
      # if: always() で片方のビルドが失敗しても、もう片方が更新できていればそのファイルだけでも反映する。
      - name: Commit updated site
        if: always()
        run: |
          git config user.name  "123tube-bot"
          git config user.email "actions@github.com"
          git add index.html data.json history.json ownch_top.json hof.json sitemap.xml pool.json \
                  en/index.html en/data.json en/history.json en/pool.json en/sitemap.xml
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップ"
          else
            git commit -m "daily update $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') JST"
            git push
          fi
